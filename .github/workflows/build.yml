name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip and Move Everything to Root
      run: |
        unzip -o *.zip
        # জিপের ভেতরের ফোল্ডার খুঁজে সব ফাইল মূল জায়গায় নিয়ে আসবে
        INNER_DIR=$(find . -mindepth 1 -maxdepth 2 -type d ! -path '*/.*' | head -n 1)
        if [ -n "$INNER_DIR" ]; then
          cp -rn $INNER_DIR/* . 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BubbleBlast-APK
        path: "**/build/outputs/apk/debug/*.apk"
